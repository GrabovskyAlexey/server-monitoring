# Prometheus в сети хоста, поэтому цели адресуются по 127.0.0.1.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9091"]

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:8081"]

  # drink-me-bot: профиль prod, порт из USE_PORT в ~/drinkmebot/.env (сейчас 8019)
  - job_name: drinkmebot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8019"]

  # poi-bot: профиль prod, порт из USE_PORT в ~/poibot/.env (сейчас 8099)
  - job_name: poibot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8099"]

  # Новое приложение с Micrometer подключается так же (порт смотрите в его .env):
  # - job_name: <имя>
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["127.0.0.1:<порт>"]
