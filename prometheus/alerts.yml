groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Цель {{ $labels.job }} не отдаёт метрики"
          description: "{{ $labels.instance }} недоступен 3 минуты (для drinkmebot это значит, что бот не запущен или завис)."

      # Критичные контейнеры пропали из cAdvisor (остановлены или удалены). Контейнеры должны
      # иметь restart=unless-stopped, иначе после ручной остановки будут алерты. Новый контейнер добавляется копией правила.
      - alert: ContainerGone
        expr: absent(container_last_seen{name="drinkmebot"})
        for: 2m
        labels: {severity: critical, container: drinkmebot}
        annotations:
          summary: "Контейнер drinkmebot не запущен"

      - alert: ContainerGone
        expr: absent(container_last_seen{name="poibot"})
        for: 2m
        labels: {severity: critical, container: poibot}
        annotations:
          summary: "Контейнер poibot не запущен"

      - alert: ContainerGone
        expr: absent(container_last_seen{name="royalguardians-backend"})
        for: 2m
        labels: {severity: critical, container: royalguardians-backend}
        annotations:
          summary: "Контейнер royalguardians-backend не запущен"

      - alert: ContainerGone
        expr: absent(container_last_seen{name="mtproto-proxy"})
        for: 2m
        labels: {severity: critical, container: mtproto-proxy}
        annotations:
          summary: "Контейнер mtproto-proxy не запущен"

      - alert: ContainerGone
        expr: absent(container_last_seen{name="pg17"})
        for: 2m
        labels: {severity: critical, container: pg17}
        annotations:
          summary: "Контейнер pg17 не запущен"

      - alert: ContainerGone
        expr: absent(container_last_seen{name="royal-redis"})
        for: 2m
        labels: {severity: critical, container: royal-redis}
        annotations:
          summary: "Контейнер royal-redis не запущен"

      - alert: ContainerGone
        expr: absent(container_last_seen{name="dcbot"})
        for: 2m
        labels: {severity: critical, container: dcbot}
        annotations:
          summary: "Контейнер dcbot не запущен"

      - alert: ContainerGone
        expr: absent(container_last_seen{name="dailycheckerbot"})
        for: 2m
        labels: {severity: critical, container: dailycheckerbot}
        annotations:
          summary: "Контейнер dailycheckerbot не запущен"

      - alert: ContainerGone
        expr: absent(container_last_seen{name="pikabu-bot"})
        for: 2m
        labels: {severity: critical, container: pikabu-bot}
        annotations:
          summary: "Контейнер pikabu-bot не запущен"

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name=~".+"}[15m]) > 2
        labels: {severity: warning}
        annotations:
          summary: "Контейнер {{ $labels.name }} перезапускается"
          description: "{{ $value }} запусков за 15 минут."

  - name: host
    rules:
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Мало свободной памяти"
          description: "Доступно {{ $value | humanizePercentage }} (swap на сервере нет)."

      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Ядро убило процесс из-за нехватки памяти (OOM)"

      - alert: HostDiskUsage
        expr: |
          1 - node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} > 0.85
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Диск заполнен больше чем на 85%"
          description: "Занято {{ $value | humanizePercentage }}."

      - alert: HostCpuHigh
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Процессор загружен больше 90% уже 15 минут"

  - name: drinkmebot
    rules:
      - alert: BotErrors
        expr: |
          sum(increase(drinkme_update_seconds_count{outcome="error"}[10m])) > 3
        labels: {severity: warning}
        annotations:
          summary: "Бот: рост ошибок обработки апдейтов"
          description: "{{ $value | printf \"%.0f\" }} ошибок за 10 минут, подробности в логе бота."

      - alert: BotSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(drinkme_update_seconds_bucket[10m]))) > 3
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Бот отвечает медленно (p95 больше 3 секунд)"

      - alert: BotHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{application="drinkmebot", area="heap"})
            / sum(jvm_memory_max_bytes{application="drinkmebot", area="heap"} > 0) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Бот: куча JVM заполнена больше чем на 90%"

      - alert: BotDbPoolExhausted
        expr: hikaricp_connections_pending{application="drinkmebot"} > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Бот: запросы ждут свободное подключение к БД"

  - name: poibot
    rules:
      - alert: PoiBotErrors
        expr: |
          sum(increase(poi_update_seconds_count{outcome="error"}[10m])) > 3
        labels: {severity: warning}
        annotations:
          summary: "poibot: рост ошибок обработки апдейтов"
          description: "{{ $value | printf \"%.0f\" }} ошибок за 10 минут, подробности в ~/poibot/logs/bot.log."

      - alert: PoiBotFlowErrors
        expr: |
          sum by (flow) (increase(poi_flow_seconds_count{outcome="error"}[10m])) > 3
        labels: {severity: warning}
        annotations:
          summary: "poibot: ошибки в сценарии {{ $labels.flow }}"
          description: "{{ $value | printf \"%.0f\" }} ошибок за 10 минут."

      - alert: PoiBotSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(poi_update_seconds_bucket[10m]))) > 3
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "poibot отвечает медленно (p95 больше 3 секунд)"

      - alert: PoiBotHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{application="poibot", area="heap"})
            / sum(jvm_memory_max_bytes{application="poibot", area="heap"} > 0) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "poibot: куча JVM заполнена больше чем на 90%"

      - alert: PoiBotDbPoolExhausted
        expr: hikaricp_connections_pending{application="poibot"} > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "poibot: запросы ждут свободное подключение к БД"

  - name: bots
    rules:
      - alert: BotUpdateErrors
        expr: sum by (application) (increase(bot_update_seconds_count{outcome="error"}[10m])) > 3
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.application }}: рост ошибок обработки апдейтов"
          description: "{{ $value | printf \"%.0f\" }} ошибок за 10 минут, подробности в логе бота."

      - alert: BotJobFailed
        expr: sum by (application, job) (increase(bot_job_seconds_count{outcome="error"}[10m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.application }}: задача {{ $labels.job }} завершилась ошибкой"

      - alert: BotResponseSlow
        expr: histogram_quantile(0.95, sum by (le, application) (rate(bot_update_seconds_bucket[10m]))) > 3
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.application }}: бот отвечает медленно (p95 больше 3 секунд)"

  - name: pikabu
    rules:
      - alert: PikabuDownloadsFailing
        expr: |
          sum(increase(bot_downloads_failed_total{job="pikabu"}[30m])) >= 5
          and
          sum(increase(bot_downloads_failed_total{job="pikabu"}[30m]))
            > sum(increase(bot_downloads_successful_total{job="pikabu"}[30m]))
        labels: {severity: warning}
        annotations:
          summary: "Pikabu: загрузки чаще падают, чем проходят"
          description: "{{ $value | printf \"%.0f\" }} неудачных загрузок за 30 минут."

      - alert: PikabuQueueStuck
        expr: bot_queue_size{job="pikabu"} > 10
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Pikabu: очередь загрузок не разбирается"
          description: "В очереди {{ $value }} задач уже 15 минут."

  - name: royalguardians
    rules:
      - alert: RgHttp5xx
        expr: |
          sum(rate(http_server_requests_seconds_count{application="royalguardians", status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{application="royalguardians"}[5m])) > 0.05
          and sum(rate(http_server_requests_seconds_count{application="royalguardians"}[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Royal Guardians: больше 5% запросов заканчиваются ошибкой 5xx"
          description: "Доля 5xx {{ $value | humanizePercentage }}, подробности в логе backend."

      - alert: RgSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="royalguardians", uri!~"/actuator.*"}[10m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Royal Guardians: backend отвечает медленно (p95 больше 2 секунд)"

      - alert: RgHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{application="royalguardians", area="heap"})
            / sum(jvm_memory_max_bytes{application="royalguardians", area="heap"} > 0) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Royal Guardians: куча JVM заполнена больше чем на 90%"

      - alert: RgDbPoolExhausted
        expr: hikaricp_connections_pending{application="royalguardians"} > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Royal Guardians: запросы ждут свободное подключение к БД"

      - alert: RgLoginFailuresBurst
        expr: sum(increase(rg_auth_total{event="login", outcome=~"bad_password|unknown_user"}[10m])) > 30
        labels: {severity: warning}
        annotations:
          summary: "Royal Guardians: всплеск неудачных входов (возможен подбор паролей)"
          description: "{{ $value | printf \"%.0f\" }} неудачных входов за 10 минут."

      - alert: RgRateLimitBurst
        expr: sum(increase(rg_rate_limit_rejected_total[10m])) > 20
        labels: {severity: warning}
        annotations:
          summary: "Royal Guardians: много запросов отклонено лимитером"
          description: "{{ $value | printf \"%.0f\" }} отказов за 10 минут, проверьте источник трафика."

      - alert: RgSsrErrors
        expr: sum(increase(ssr_render_duration_seconds_count{outcome=~"error|api_error"}[10m])) > 5
        labels: {severity: warning}
        annotations:
          summary: "Royal Guardians SSR: ошибки серверного рендера"
          description: "{{ $value | printf \"%.0f\" }} ошибок за 10 минут (api_error — backend не ответил SSR)."

      - alert: RgSsrSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(ssr_render_duration_seconds_bucket[10m]))) > 3
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Royal Guardians SSR: страницы рендерятся медленно (p95 больше 3 секунд)"

      - alert: RgFrontendErrors
        expr: sum(increase(frontend_errors_total[30m])) > 20
        labels: {severity: warning}
        annotations:
          summary: "Royal Guardians: всплеск ошибок JavaScript в браузерах"
          description: "{{ $value | printf \"%.0f\" }} ошибок за 30 минут, смотрите дашборд Royal Guardians."

      - alert: RgWebVitalsPoor
        expr: |
          histogram_quantile(0.75, sum by (le) (rate(frontend_web_vital_bucket{name="LCP"}[1h]))) > 4000
          and sum(increase(frontend_web_vital_count{name="LCP"}[1h])) > 20
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Royal Guardians: LCP (p75) хуже 4 секунд, страницы грузятся медленно"
